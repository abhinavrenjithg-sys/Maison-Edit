<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#efede9">
<meta name="description" content="Build your look: try every piece on a model, save outfits and shop them in one tap.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Maison Edit — Build Your Look</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,500;0,600;1,500;1,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--page:#efede9;--panel:#f7f6f3;--tile:#ebe9e5;--ink:#151515;--ink-2:#5e5c58;--mute:#9b9892;--line:#e4e1dc;
  --shadow:0 1px 1px rgba(0,0,0,.02),0 10px 30px -18px rgba(40,30,20,.18);
  --soft:0 1px 2px rgba(0,0,0,.05),0 6px 16px -8px rgba(40,30,20,.22);
  --ease:cubic-bezier(.6,0,.2,1);--spring:cubic-bezier(.3,1.6,.5,1)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--page);color:var(--ink);font:400 clamp(11px,.86vw,13px)/1.35 Inter,system-ui,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.pt{background-image:var(--sheet);background-repeat:no-repeat;background-color:var(--tile)}
.panel{background:var(--panel);border-radius:14px;box-shadow:var(--shadow)}

#app{height:100vh;display:grid;grid-template-columns:minmax(0,357fr) minmax(0,500fr) minmax(0,292fr);padding:0 7.3vw}

/* ---------- left ---------- */
#left,#right{position:relative;z-index:3}
#left{display:flex;flex-direction:column;padding:2.6vh 0 3.4vh;min-height:0;min-width:0}
.toprow{height:6vh;flex:none;display:flex;align-items:center;justify-content:space-between}
.logo{font-family:'Bodoni Moda',serif;font-weight:500;font-size:clamp(20px,2.15vw,32px);letter-spacing:.035em;white-space:nowrap}
.toprow svg.i{width:22px;height:22px}
#shop{margin-top:1.6vh;flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.search{margin:2vh 1.1vw 0;height:clamp(34px,4.6vh,44px);flex:none;border-radius:22px;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.04),0 4px 14px -6px rgba(40,30,20,.14);display:flex;align-items:center;gap:10px;padding:0 16px;color:var(--ink-2)}
.search input{border:0;outline:0;flex:1;min-width:0;background:none;font:inherit;color:var(--ink)}
.search input::placeholder{color:var(--mute)}
.tabs{position:relative;flex:none;display:flex;gap:clamp(12px,1.75vw,26px);margin:1.8vh 1.1vw 0;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:1.1vh 0 1.2vh;color:var(--mute);white-space:nowrap;transition:color .25s}
.tab:hover{color:var(--ink-2)}
.tab.on{color:var(--ink);font-weight:500}
.tabs .ul{position:absolute;bottom:0;height:2px;background:var(--ink);left:0;width:0;transition:left .4s var(--ease),width .4s var(--ease)}
.scroll{flex:1;min-height:0;overflow-y:auto;padding:2vh 1.1vw 2vh;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.sh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:1.2vh}
.sh h3{font-size:1.08em;font-weight:600}
.sh a,.sh span{color:var(--ink-2);font-size:.92em}
.sh a{cursor:pointer}.sh a:hover{color:var(--ink)}
.stores{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.6vw;margin-bottom:2.4vh}
.store{height:clamp(40px,7.6vh,58px);border-radius:8px;background:var(--tile);display:flex;align-items:center;justify-content:center;text-align:center;border:1.5px solid transparent;line-height:1.05;transition:transform .25s,background .25s,border-color .25s;overflow:hidden}
.store:hover{transform:translateY(-2px)}
.store.on{border-color:var(--ink);background:#fff}
.wm-norra{font-weight:600;letter-spacing:.2em;font-size:.86em;padding-left:.2em}
.wm-lune{font-family:'Bodoni Moda',serif;font-style:italic;font-weight:500;font-size:1.2em}
.wm-mer{font-family:'Bodoni Moda',serif;font-weight:500;font-size:.86em;letter-spacing:.04em}
.wm-ode{font-weight:600;font-size:.74em;letter-spacing:.14em}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:2vh 1.1vw}
.card{cursor:pointer;animation:fu 380ms both;min-width:0}
@keyframes fu{from{opacity:0;transform:translateY(10px)}}
.card .th{position:relative;aspect-ratio:523/400;border-radius:8px;box-shadow:inset 0 0 0 1.5px transparent;transition:box-shadow .2s}
.card:hover .th{box-shadow:inset 0 0 0 1.5px #d3cfc8}
.card.wearing .th{box-shadow:inset 0 0 0 1.5px var(--ink)}
.heart{position:absolute;top:6px;right:6px;width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.88);display:grid;place-items:center}
.heart svg{width:14px;height:14px;fill:transparent;stroke:var(--ink);stroke-width:1.7;transition:fill .2s}
.heart.on svg{fill:var(--ink)}
.heart.pop{animation:spring .5s var(--spring)}
@keyframes spring{0%{transform:scale(.6)}100%{transform:scale(1)}}
.wtag{position:absolute;left:6px;bottom:6px;background:var(--ink);color:#fff;font-size:.7em;font-weight:600;letter-spacing:.1em;padding:3px 6px;border-radius:4px;opacity:0;transform:translateY(8px) scale(.7);transition:opacity .3s,transform .45s var(--spring)}
.card.wearing .wtag{opacity:1;transform:none}
.try{position:absolute;right:6px;bottom:6px;background:#fff;font-size:.78em;font-weight:500;padding:3px 9px;border-radius:12px;opacity:0;transition:opacity .2s}
.card:hover .try{opacity:1}
.st{font-weight:600;font-size:.76em;letter-spacing:.08em;text-transform:uppercase;margin-top:.8vh;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nm{color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pr{font-weight:500}
.empty{grid-column:1/-1;color:var(--mute);text-align:center;padding:4vh 0}
.tabbar{flex:none;display:flex;justify-content:space-around;border-top:1px solid var(--line);padding:1vh 4px 1.2vh}
.tb{display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--mute);font-size:.82em;transition:color .2s}
.tb:hover{color:var(--ink-2)}
.tb.on{color:var(--ink);font-weight:500}

/* ---------- stage ---------- */
#stage{position:relative;min-width:0;--H:100vh;--fh:calc(var(--H)*.855)}
#figure{position:absolute;left:45%;top:calc(var(--H)*.036);height:var(--fh);aspect-ratio:1360/2048;transform:translateX(-50%);z-index:2}
#tt{position:absolute;left:-6%;width:112%;--th:calc(var(--fh)*1360/2048*1.12/3.3);height:var(--th);top:calc(98.6% - .4*var(--th));z-index:0}
#tt .side{position:absolute;inset:16% 0 0 0;border-radius:50%;background:linear-gradient(#e2dfda,#d3cfc8)}
#tt .top{position:absolute;inset:0 0 16% 0;border-radius:50%;background:radial-gradient(ellipse at 50% 38%,#fdfcfb,#f3f1ee 60%,#e7e4df)}
#tt .ring{position:absolute;inset:9% 5%;width:90%;height:82%;overflow:visible}
#tt .ring ellipse{fill:none;stroke:rgba(0,0,0,.13);stroke-width:1.2;stroke-dasharray:3 5;vector-effect:non-scaling-stroke}
.ttl{position:absolute;left:50%;top:60%;transform:translate(-50%,-50%);display:flex;align-items:center;gap:6px;color:var(--mute);font-size:10px;font-weight:500;letter-spacing:.08em;white-space:nowrap;cursor:default}
.ttl svg{width:34px;height:12px;fill:none;stroke:currentColor;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round;transition:transform .35s var(--spring)}
.ttl:hover svg.al{transform:translateX(-4px)}
.ttl:hover svg.ar{transform:translateX(4px)}
#shadow{position:absolute;top:96.6%;left:50%;width:46%;height:3.2%;transform:translateX(-50%);background:radial-gradient(closest-side,rgba(0,0,0,.26),transparent);filter:blur(2px);z-index:1;pointer-events:none}
#body{position:absolute;inset:0;perspective:1600px;cursor:grab;touch-action:pan-y;z-index:2}
#body.dragging{cursor:grabbing}
#spin{position:absolute;inset:0;transform:rotateY(var(--ry,0deg));transform-origin:50% 100%}
#spin canvas{position:absolute;inset:0;width:100%;height:100%;display:block;user-select:none}
#glint{position:absolute;left:10%;right:10%;top:0;height:2px;border-radius:2px;background:#fff;box-shadow:0 0 8px 2px rgba(255,255,255,.9),0 0 24px 6px rgba(255,255,255,.55);opacity:0;pointer-events:none;transform:translateY(-1px)}

#ar{position:absolute;left:4%;right:4%;top:calc(var(--H)*.026);bottom:calc(var(--H)*.034);border-radius:16px;overflow:hidden;opacity:0;transform:scale(.94);transition:opacity .6s ease,transform .9s cubic-bezier(.2,.8,.2,1);z-index:0;pointer-events:none;background:#ddd var(--room) center/cover no-repeat}
#stage.ar #ar{opacity:1;transform:none}
.cb{position:absolute;width:22px;height:22px;border:2px solid #fff;opacity:.95}
.cb.a{top:14px;left:14px;border-right:0;border-bottom:0;border-top-left-radius:6px}
.cb.b{top:14px;right:14px;border-left:0;border-bottom:0;border-top-right-radius:6px}
.cb.c{bottom:14px;left:14px;border-right:0;border-top:0;border-bottom-left-radius:6px}
.cb.d{bottom:14px;right:14px;border-left:0;border-top:0;border-bottom-right-radius:6px}
.scan{position:absolute;left:0;right:0;top:0;height:2px;background:linear-gradient(90deg,transparent,#fff 20%,#fff 80%,transparent);box-shadow:0 0 14px 3px rgba(255,255,255,.7);opacity:0}
#stage.ar .scan.go{animation:scan 1.7s ease-in-out .25s 1 both}
@keyframes scan{0%{top:0;opacity:0}8%{opacity:1}90%{opacity:1}100%{top:100%;opacity:0}}
.arl{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);background:rgba(21,21,21,.6);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);color:#fff;font-size:11px;padding:6px 12px;border-radius:20px;display:flex;align-items:center;gap:8px;white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;background:#ff3b30;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,59,48,.6)}50%{box-shadow:0 0 0 5px rgba(255,59,48,0)}}

#rail{position:absolute;left:8.4%;top:calc(var(--H)*.086);display:flex;flex-direction:column;gap:clamp(6px,1.2vh,10px);z-index:6}
.rb{position:relative;width:clamp(30px,5.2vh,40px);height:clamp(30px,5.2vh,40px);border-radius:50%;background:#fbfaf8;box-shadow:var(--soft);display:grid;place-items:center;color:var(--ink);transition:transform .2s,background .25s,color .25s,opacity .25s}
.rb svg.i{width:46%;height:46%}
.rb:hover{transform:scale(1.08)}
.rb.on{background:var(--ink);color:#fff}
.rb:disabled{opacity:.4;cursor:default;transform:none}
.rb::after{content:attr(data-tip);position:absolute;left:calc(100% + 10px);top:50%;transform:translate(-4px,-50%);background:var(--ink);color:#fff;font-size:11px;font-weight:400;white-space:nowrap;padding:5px 10px;border-radius:20px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
.rb:not(:disabled):hover::after{opacity:1;transform:translate(0,-50%)}

#strip{position:absolute;left:75.4%;top:calc(var(--H)*.108);background:#fbfaf8;border-radius:10px;padding:6px;display:flex;flex-direction:column;gap:6px;box-shadow:var(--soft);z-index:5}
.sth{width:clamp(36px,4vw,56px);aspect-ratio:523/537;border-radius:6px;cursor:pointer;box-shadow:inset 0 0 0 1.5px transparent;transition:box-shadow .2s}
.sth:hover,.sth.hl{box-shadow:inset 0 0 0 1.5px var(--ink)}
.sth.pop{animation:pop .5s var(--spring)}
@keyframes pop{from{transform:scale(.6)}to{transform:scale(1)}}

#mode{position:absolute;left:72%;top:calc(var(--H)*.04);display:flex;background:#fbfaf8;border-radius:20px;padding:3px;box-shadow:var(--soft);z-index:6}
.mb{position:relative;z-index:1;padding:5px 13px;font-weight:500;font-size:.9em;border-radius:16px;transition:color .3s}
.mb.on{color:#fff}
#mode .ind{position:absolute;top:3px;bottom:3px;left:0;border-radius:16px;background:var(--ink);transition:transform .4s var(--ease),width .4s var(--ease)}

/* ---------- right ---------- */
#right{display:flex;flex-direction:column;gap:1.4vh;padding:8.6vh 0 3.4vh;min-height:0;min-width:0}
#look{flex:1;min-height:0;display:flex;flex-direction:column;padding:2vh 1.1vw 1.8vh}
.lh{display:flex;justify-content:space-between;align-items:baseline;flex:none}
.lh h2{font-size:.9em;letter-spacing:.2em;font-weight:600}
.total{font-weight:600;font-size:1.1em}
.rows{flex:1;min-height:0;display:flex;flex-direction:column;margin-top:.8vh}
.lrow{flex:1;min-height:0;display:flex;align-items:center;gap:.9vw;padding:.5vh 4px;border-bottom:1px solid var(--line);cursor:pointer;border-radius:6px;transition:background .2s}
.lrow:hover,.lrow.hl{background:rgba(0,0,0,.03)}
.lrow .th{height:min(9vh,100%);aspect-ratio:523/450;border-radius:8px;flex:none}
.th.swap{animation:swapIn .55s var(--spring)}
@keyframes swapIn{from{transform:scale(.6) rotate(-8deg)}to{transform:none}}
.lrow .inf2{flex:1;min-width:0}
.lrow .st{margin-top:0}
.chev{color:var(--ink-2);transition:transform .2s;width:14px!important;height:14px!important}
.lrow:hover .chev{transform:translateX(2px)}
.sf{flex:none;margin-top:1.4vh}
.sf h4{font-size:.82em;letter-spacing:.16em;font-weight:600;margin-bottom:.5vh}
.fr{position:relative;display:flex;align-items:center;gap:8px;padding:.45vh 0;cursor:default}
.ck{width:16px;height:16px;flex:none}
.ck circle{fill:transparent;stroke:#cfcbc4;stroke-width:1.5;transition:fill .3s,stroke .3s;transition-delay:inherit}
.ck path{fill:none;stroke:#fff;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:12;stroke-dashoffset:12;transition:stroke-dashoffset .35s ease;transition-delay:inherit}
.fr.on .ck circle{fill:var(--ink);stroke:var(--ink)}
.fr.on .ck path{stroke-dashoffset:0}
.fr .q{color:var(--mute);font-size:.95em}
.fr .pct{margin-left:auto;font-weight:500}
.bub{position:absolute;left:0;bottom:calc(100% + 2px);background:var(--ink);color:#fff;padding:6px 10px;border-radius:8px;font-size:11px;white-space:nowrap;opacity:0;transform:translateY(4px);transition:opacity .2s,transform .2s;pointer-events:none;z-index:8}
.fr:hover .bub{opacity:1;transform:none}
#stl{position:relative;flex:none;margin-top:1.4vh;width:100%;height:clamp(36px,5.2vh,44px);background:#2b2b2b;color:#fff;border-radius:9px;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:500;overflow:hidden;transition:background .2s}
#stl:hover{background:#1f1f1f}
#stl svg.i{width:15px;height:15px}
#stl .sweep{position:absolute;top:0;bottom:0;left:-60%;width:45%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.32),transparent);transform:skewX(-20deg);pointer-events:none}
#stl.go .sweep{animation:sweep .8s ease}
@keyframes sweep{to{left:120%}}
#stl .badge{position:absolute;right:12px;top:50%;width:20px;height:20px;border-radius:50%;background:#fff;color:#2b2b2b;font-size:11px;font-weight:600;display:grid;place-items:center;transform:translateY(-50%) scale(0);transition:transform .45s var(--spring)}
#stl .badge.on{transform:translateY(-50%) scale(1)}
#rec{flex:none;padding:1.6vh 1.1vw}
.rh{display:flex;align-items:center;gap:6px;font-weight:600;margin-bottom:1.1vh}
.rh svg{width:14px;height:14px;fill:var(--ink)}
.recs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.7vw}
.rc{cursor:pointer;min-width:0;animation:fu 380ms both}
.rc .th{aspect-ratio:523/450;border-radius:8px;box-shadow:inset 0 0 0 1.5px transparent;transition:box-shadow .2s}
.rc:hover .th{box-shadow:inset 0 0 0 1.5px #d3cfc8}
.rc .st{margin-top:.6vh;font-size:.7em}
.rc .nm,.rc .pr{font-size:.92em}

#toast{position:fixed;top:18px;left:50%;transform:translate(-50%,-24px) scale(.9);opacity:0;background:var(--ink);color:#fff;font-size:12px;padding:8px 16px;border-radius:20px;transition:transform .5s var(--spring),opacity .25s;z-index:100;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1;transform:translate(-50%,0) scale(1)}
.fly{position:fixed;z-index:90;pointer-events:none;border-radius:8px;transform-origin:0 0;box-shadow:0 10px 24px -10px rgba(0,0,0,.35)}

/* ---------- app chrome: bag button, drawers ---------- */
.tr-btns{display:flex;align-items:center;gap:14px}
#bagBtn{position:relative}
#bagCount{position:absolute;top:-6px;right:-8px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--ink);color:#fff;font-size:10px;font-weight:600;display:grid;place-items:center;transform:scale(0);transition:transform .35s var(--spring)}
#bagCount.on{transform:scale(1)}
#bagCount.pop{animation:spring .5s var(--spring)}
.addb{position:absolute;top:6px;left:6px;width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.88);display:grid;place-items:center}
.addb svg{width:14px;height:14px;fill:none;stroke:var(--ink);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
#scrim{position:fixed;inset:0;background:rgba(21,21,21,.32);opacity:0;pointer-events:none;transition:opacity .35s;z-index:80}
#scrim.on{opacity:1;pointer-events:auto}
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(420px,100vw);background:var(--panel);z-index:81;transform:translateX(102%);transition:transform .45s var(--ease);display:flex;flex-direction:column;box-shadow:-20px 0 40px -20px rgba(0,0,0,.25);padding-bottom:env(safe-area-inset-bottom)}
#drawer.on{transform:none}
.dh{display:flex;align-items:center;justify-content:space-between;padding:22px 22px 14px;border-bottom:1px solid var(--line);flex:none}
.dh h2{font-family:'Bodoni Moda',serif;font-weight:500;font-size:24px}
.db{flex:1;min-height:0;overflow-y:auto;padding:14px 22px}
.df{flex:none;border-top:1px solid var(--line);padding:16px 22px 20px;display:flex;flex-direction:column;gap:10px}
.dl{display:flex;justify-content:space-between;color:var(--ink-2)}
.dl.big{color:var(--ink);font-weight:600;font-size:1.15em}
.btn{height:46px;border-radius:9px;background:#2b2b2b;color:#fff;font-weight:500;display:flex;align-items:center;justify-content:center;gap:8px;width:100%}
.btn:hover{background:#1f1f1f}
.btn:disabled{opacity:.4;cursor:default}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.ghost:hover{box-shadow:inset 0 0 0 1.5px var(--ink)}
.bi{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.bi .th{width:84px;aspect-ratio:523/450;border-radius:8px;flex:none}
.bi .inf2{flex:1;min-width:0}
.qty{display:flex;align-items:center;gap:2px;margin-top:6px}
.qty button{width:26px;height:26px;border-radius:50%;box-shadow:inset 0 0 0 1px var(--line);font-size:15px;line-height:1}
.qty button:hover{box-shadow:inset 0 0 0 1px var(--ink)}
.qty span{min-width:24px;text-align:center;font-weight:500}
.rm{color:var(--mute);font-size:.9em;align-self:flex-start}
.rm:hover{color:var(--ink)}
.dempty{color:var(--mute);text-align:center;padding:48px 0;line-height:1.6}
.oc{padding:12px 0;border-bottom:1px solid var(--line)}
.oc .ths{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:8px 0;cursor:pointer}
.oc .ths .th{aspect-ratio:523/450;border-radius:6px}
.oc .row2{display:flex;justify-content:space-between;align-items:center;gap:10px}
.oc input{font:inherit;font-weight:600;border:0;background:none;outline:0;min-width:0;flex:1;padding:2px 0;border-bottom:1px solid transparent}
.oc input:focus{border-bottom-color:var(--ink)}
.lk{font-size:.9em;color:var(--ink-2);text-decoration:underline;text-underline-offset:2px}
.lk:hover{color:var(--ink)}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 18px}
.seg button{min-width:44px;height:36px;padding:0 12px;border-radius:18px;box-shadow:inset 0 0 0 1px var(--line);background:#fff}
.seg button.on{background:var(--ink);color:#fff;box-shadow:none}
.lab{font-size:.82em;letter-spacing:.16em;font-weight:600;margin-top:6px}
.fld{display:flex;align-items:center;gap:8px;margin:8px 0 18px}
.fld input{width:90px;height:36px;border-radius:8px;border:1px solid var(--line);background:#fff;padding:0 10px;font:inherit}
.ord{padding:10px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px}
.ord small{color:var(--mute);display:block}
.form{display:flex;flex-direction:column;gap:10px}
.form input{height:42px;border-radius:8px;border:1px solid var(--line);background:#fff;padding:0 12px;font:inherit}
.form input:focus{outline:0;border-color:var(--ink)}
.note{color:var(--mute);font-size:.9em;line-height:1.5}

@media (max-width:1100px){#app{padding:0 3vw}}
@media (max-width:860px){
  body{overflow:auto}
  #app{height:auto;display:flex;flex-direction:column;padding:16px;gap:16px}
  #app{padding:calc(64px + env(safe-area-inset-top)) 16px calc(84px + env(safe-area-inset-bottom))}
  #stage{order:1;--fh:min(calc(92svh*.84),calc((100vw - 32px)*1.3),690px);--H:calc(var(--fh)/.84);height:var(--H)}
  .toprow{position:fixed;top:0;left:0;right:0;z-index:20;height:calc(56px + env(safe-area-inset-top));padding:env(safe-area-inset-top) 16px 0;background:rgba(239,237,233,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
  .tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(247,246,243,.96);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:8px 4px calc(10px + env(safe-area-inset-bottom));box-shadow:0 -8px 20px -16px rgba(0,0,0,.3)}
  #shop{margin-top:0;scroll-margin-top:calc(68px + env(safe-area-inset-top))}
  .addb,.heart{width:32px;height:32px}
  .card .try{opacity:1}
  #figure{left:50%}
  #rail{left:0;top:56px}
  #strip{left:auto;right:0;top:56px}
  #mode{left:auto;right:0;top:8px}
  #ar{left:0;right:0;top:0;bottom:0}
  #right{order:2;padding:0}
  #look{flex:none}
  .lrow{min-height:76px}
  .lrow .th{height:64px}
  #left{order:3;height:88svh;padding:0}
}
</style>
</head>

  </section>
</div>

/* ---------- count up ---------- */
function countUp(el, to, fmt, dur = 600) {
  const from = el._v ?? to; el._v = to;
  cancelAnimationFrame(el._raf);
  const t0 = performance.now();
  const step = now => {
    const t = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - t, 3);
    el.textContent = fmt(from + (to - from) * e);
    if (t < 1) el._raf = requestAnimationFrame(step);
  };
  el._raf = requestAnimationFrame(step);
}

/* ---------- compositor ---------- */
const cOld = $('#cOld'), cNew = $('#cNew'), glint = $('#glint');
const xOld = cOld.getContext('2d'), xNew = cNew.getContext('2d');
const W = 1000, HH = 1506;
const off = document.createElement('canvas'); off.width = W; off.height = HH;
const ox = off.getContext('2d');
const IM = {}, MK = {};

function load(src, cors = true) {
  return new Promise(res => {
    const i = new Image();
    if (cors) i.crossOrigin = 'anonymous';
    i.onload = () => res(i);
    i.onerror = () => cors ? load(src, false).then(res) : res(null);
    i.src = src;
  });
}

function draw(ctx, L) {
  ctx.globalCompositeOperation = 'source-over';
  ctx.clearRect(0, 0, W, HH);
  if (IM.base) ctx.drawImage(IM.base, 0, 0, W, HH);
  for (const c of ['s', 'k', 't', 'g']) {
    const k = L[c];
    if (k.endsWith('1') || !IM[k] || !MK[k]) continue;
    ox.globalCompositeOperation = 'source-over';
    ox.clearRect(0, 0, W, HH);
    ox.drawImage(MK[k], 0, 0, W, HH);
    ox.globalCompositeOperation = 'source-in';
    ox.drawImage(IM[k], 0, 0, W, HH);
    ox.globalCompositeOperation = 'source-over';
    ctx.globalCompositeOperation = 'destination-out';
    ctx.drawImage(MK[k], 0, 0, W, HH);
    ctx.globalCompositeOperation = 'lighter';
    ctx.drawImage(off, 0, 0);
    ctx.globalCompositeOperation = 'source-over';
  }
}

let anim = null, drawn = { ...look }, ready = false;
function render(cats) {
  if (!ready || !cats.length) return;
  if (anim) { cancelAnimationFrame(anim); anim = null; draw(xOld, drawn); }
  draw(xNew, look); drawn = { ...look };
  const y0 = Math.min(...cats.map(c => REG[c][0])), y1 = Math.max(...cats.map(c => REG[c][1]));
  const t0 = performance.now(), D = 720;
  const frame = now => {
    const t = Math.min(1, (now - t0) / D);
    const e = t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
    const y = (y0 + (y1 - y0) * e) * 100;
    cNew.style.clipPath = `inset(0 0 ${100 - y}% 0)`;
    cOld.style.clipPath = `inset(${y}% 0 0 0)`;
    glint.style.top = y + '%';
    glint.style.opacity = Math.min(1, Math.sin(Math.PI * t) * 1.6);
    if (t < 1) { anim = requestAnimationFrame(frame); return; }
    anim = null;
    xOld.globalCompositeOperation = 'source-over';
    xOld.clearRect(0, 0, W, HH); xOld.drawImage(cNew, 0, 0);
    cNew.style.clipPath = 'none'; cOld.style.clipPath = 'none';
    glint.style.opacity = 0;
  };
  anim = requestAnimationFrame(frame);
}

function wear(key, src) {
  const c = key[0];
  toast('Trying on · ' + P[key].n);
  if (look[c] === key) return;
  hist.push({ ...look });
  look[c] = key;
  render([c]); sync([c]);
  if (src) fly(src, stripEls[c]);
}
function next(c) { return c + ((+look[c][1]) % 3 + 1); }
function cycle(c, src) { wear(next(c), src); }
function undo() {
  if (!hist.length) return;
  const prev = hist.pop();
  const changed = ORDER.filter(c => prev[c] !== look[c]);
  look = prev;
  render(changed); sync(changed);
}
let si = 0, stylistT = [];
function stylist() {
  stylistT.forEach(clearTimeout); stylistT = [];
  const L = LOOKS[si++ % LOOKS.length];
  toast('AI stylist · ' + L.name);
  const diffs = L.k.filter(k => look[k[0]] !== k);

function fly(src, dst, opts = {}) {
  if (!src || !dst) return;
  const a = src.getBoundingClientRect(), b = dst.getBoundingClientRect();
  if (!a.width || !b.width) return;
  const g = document.createElement('div');
  g.className = 'pt fly';
  g.style.backgroundSize = src.style.backgroundSize;
  g.style.backgroundPosition = src.style.backgroundPosition;
  Object.assign(g.style, { left: a.left + 'px', top: a.top + 'px', width: a.width + 'px', height: a.height + 'px' });
  document.body.appendChild(g);
  const sx = opts.scale ?? b.width / a.width, sy = opts.scale ?? b.height / a.height;
  const tx = opts.center ? b.left + b.width / 2 - a.left - a.width * sx / 2 : b.left - a.left;
  const ty = opts.center ? b.top + b.height / 2 - a.top - a.height * sy / 2 : b.top - a.top;
  g.animate([
    { transform: 'translate(0,0) scale(1)', opacity: 1 },
    { transform: `translate(${tx}px,${ty}px) scale(${sx},${sy})`, opacity: opts.fade ?? .5 }
  ], { duration: opts.dur ?? 650, delay: opts.delay ?? 0, easing: 'cubic-bezier(.6,0,.2,1)', fill: 'both' }).onfinish = () => g.remove();
}

function matches(k) {

  if (F.store && p.s !== F.store) return false;

    const hay = (p.n + ' ' + STORES[p.s] + ' ' + CATWORDS[c]).toLowerCase();
    if (!F.q.toLowerCase().split(/\s+/).filter(Boolean).every(w => hay.includes(w))) return false;
  }
  return true;
}

function scores() {
  const cnt = {};
  ORDER.forEach(c => P[look[c]].tags.forEach(t => cnt[t] = (cnt[t] || 0) + 1));
  const mx = Math.max(...Object.values(cnt));
  const style = Math.min(99, 56 + 9 * mx);
  const body = 78 + (look.k === 'k1' ? 14 : look.k === 'k3' ? 10 : 6) + (look.s !== 's2' ? 4 : 0);
  return [100, style, body];
}

function renderRecs() {
  const worn = Object.values(look), mood = P[look.t].tags[0];
  const cand = KEYS.filter(k => !worn.includes(k))
    .map((k, i) => ({ k, i, m: P[k].tags.includes(mood) ? 0 : 1 }))
    .sort((a, b) => a.m - b.m || a.i - b.i).slice(0, 3).map(o => o.k);
  const box = $('#recs');
  const prev = [...box.children].map(e => e.dataset.k).join();
  if (prev === cand.join()) return;
  box.innerHTML = '';
  cand.forEach((k, i) => {
    const p = P[k], d = document.createElement('div');
    d.className = 'rc'; d.dataset.k = k; d.style.animationDelay = i * 35 + 'ms';
    d.innerHTML = `<div class="th pt"></div><div class="st">${STORES[p.s]}</div><div class="nm">${p.n}</div><div class="pr">${money(p.p)}</div>`;
    pt(d.querySelector('.th'), k, 450);
    d.addEventListener('click', () => wear(k, d.querySelector('.th')));
    box.appendChild(d);
  });
}

function sync(changed = []) {
  ORDER.forEach(c => {
    const k = look[c], p = P[k];
    pt(stripEls[c], k, 537);
    const r = rowEls[c], th = r.querySelector('.th');
    pt(th, k, 450);
    r.querySelector('.st').textContent = STORES[p.s];
    r.querySelector('.nm').textContent = p.n;
    r.querySelector('.pr').textContent = money(p.p);
    if (changed.includes(c)) {
      [stripEls[c], th].forEach((el, j) => {
        const cls = j ? 'swap' : 'pop';
        el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls);
      });
    }
    const rb = document.querySelector(`.rb[data-rc="${c}"]`);
    rb.dataset.tip = `${CATS[c]} · ${p.n}`;
  });
  grid.querySelectorAll('.card').forEach(cd => cd.classList.toggle('wearing', look[cd.dataset.k[0]] === cd.dataset.k));
  const total = ORDER.reduce((s, c) => s + P[look[c]].p, 0);
  countUp($('#total'), total, money);
  const sc = scores();
  fitEls.forEach((el, i) => {
    el.style.transitionDelay = i * 140 + 'ms';
    el.classList.toggle('on', sc[i] >= 80);
    countUp(el.querySelector('.pct'), sc[i], v => Math.round(v) + '%');
  });
  renderRecs();
  $('#undo').disabled = !hist.length;
  persist();
}

function renderBag() {

    dBody.innerHTML = '<div class="dempty">Your bag is empty.<br>Tap “Shop the Look” or the bag icon on any piece.</div>';

  }
  bag.forEach(b => {
    const p = P[b.k], d = document.createElement('div');
    d.className = 'bi';
    d.innerHTML = `<div class="th pt"></div><div class="inf2"><div class="st">${STORES[p.s]}</div><div class="nm">${p.n}</div><div class="pr">${money(p.p * b.q)}</div>

function renderCheckout() {

      <p class="note">Demo store: no payment is taken. Placing the order saves it to your profile on this device.</p>
    </form>`;

    <button class="btn" id="place">Place order</button><button class="btn ghost" id="backBag">Back to bag</button>`;
  $('#backBag').addEventListener('click', () => { drawerView = 'bag'; renderDrawer(); });

    const f = $('#coForm'), data = Object.fromEntries(new FormData(f));

/* ---------- drag to rotate + turntable ---------- */
const body = $('#body'), spin = $('#spin'), ring = $('#ring'), shadow = $('#shadow');
let ry = 0, drag = null, vel = 0, dash = 0;
body.addEventListener('pointerdown', e => {
  drag = { x: e.clientX, start: ry, lx: e.clientX };
  body.setPointerCapture(e.pointerId); body.classList.add('dragging');
});
body.addEventListener('pointermove', e => {
  if (!drag) return;
  ry = clamp(drag.start + (e.clientX - drag.x) * .22, -34, 34);
  vel = e.clientX - drag.lx; drag.lx = e.clientX;
});
const end = () => { drag = null; body.classList.remove('dragging'); };
body.addEventListener('pointerup', end); body.addEventListener('pointercancel', end);
(function loop() {
  if (!drag) { ry *= .92; if (Math.abs(ry) < .01) ry = 0; }
  spin.style.setProperty('--ry', ry + 'deg');
  shadow.style.transform = `translateX(calc(-50% + ${(-ry * .45).toFixed(2)}px)) scaleX(${(1 - Math.abs(ry) / 34 * .12).toFixed(3)})`;
  dash -= .06 + Math.min(Math.abs(vel), 40) * .09;
  vel *= .9;
  ring.style.strokeDashoffset = dash.toFixed(2);
  requestAnimationFrame(loop);
})();

/* ---------- init ---------- */
setCat('all');
sync();
updateBagCount();
updateFitCopy();
if (bag.length) $('#badge').classList.add('on');

/* offline support for the installed web app (the Android app serves files itself) */
if ('serviceWorker' in navigator && location.protocol !== 'file:' && location.hostname !== 'appassets.androidplatform.net') {
  addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
addEventListener('resize', () => { moveUL(); setMode(stage.classList.contains('ar') ? 'ar' : '3d'); });
(document.fonts ? document.fonts.ready : Promise.resolve()).then(() => { moveUL(); setMode('3d'); });
setMode('3d');

Promise.all([
  ...Object.entries(MODEL).map(([k, f]) => load(H(f, 1000)).then(i => IM[k] = i)),
  ...Object.entries(MASKS).map(([k, d]) => load(d).then(i => MK[k] = i))
]).then(() => {
  ready = true;
  draw(xOld, look); draw(xNew, look); drawn = { ...look };
});
})();
</script>
